[project]
name = "equity-metrics"
version = "0.1.0"
description = "Curated quarterly KPI estimates served over HTTP and MCP."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "mcp>=2.1",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "anyio>=4",
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
equity-import = "equity_metrics.importer.cli:main"
equity-mcp = "equity_metrics.mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["equity_metrics"]
mypy_path = "src"
strict = true

# `anthropic` is an optional dependency, imported only when the live provider is
# configured; the default mock path never needs it installed.
[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
