services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-equity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-equity}
      POSTGRES_DB: ${POSTGRES_DB:-equity_metrics}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-equity} -d ${POSTGRES_DB:-equity_metrics}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-equity}:${POSTGRES_PASSWORD:-equity}@db:5432/${POSTGRES_DB:-equity_metrics}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-mock-model}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Migrations always run at start; the import is idempotent and on by
      # default so a fresh stack answers questions immediately.
      IMPORT_ON_START: ${IMPORT_ON_START:-true}
      CSV_PATH: /data/kpi_sample.csv
    volumes:
      - ./kpi_sample_2000__282_29__281_29.csv:/data/kpi_sample.csv:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./web
    environment:
      VITE_API_PROXY: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - /app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  postgres_data:
